# Fix Colors
# set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using C-[ and C-], make sure they open in the same path
bind C-o split-window -h -c "#{pane_current_path}"
bind C-u split-window -v -c "#{pane_current_path}"

bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5

unbind '"'
unbind %

# open new windows in the current path
bind C-c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

bind C-p previous-window
bind C-n next-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

set -g status-position top

# List of plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "none"

set -g @catppuccin_window_current_fill "all"

set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_color "#ffd76d" # monokai-pro octagon flavor: accent3, amarillito https://github.com/loctvl842/monokai-pro.nvim/blob/master/lua/monokai-pro/colorscheme/palette/octagon.lua
# set -g @catppuccin_window_current_color "#ff657a" # monokai-pro octagon flavor: accent1, rojito
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "user host session"

set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "yes"

set -g @catppuccin_user_color "#ba89d1" # julia inspired purple
set -g @catppuccin_host_color "#7aa2f7" # tokyo night storm normal blue https://github.com/folke/tokyonight.nvim/blob/main/extras/alacritty/tokyonight_storm.toml
# set -g @catppuccin_host_color "#ff657a" # monokai-pro octagon flavor: accent1, rojito

set -g @catppuccin_host_icon ""
set -g @catppuccin_host_text "#(hostnamectl --static)"

# set -g @catppuccin_status_background "default" # transparent
set -g @catppuccin_status_background "#161821" # monokai-pro octagon flavor: dark2

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

