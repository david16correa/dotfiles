#------------------------------------------------------------------------------#
# these settings are applied across all keyboards
[ids]
*

#------------------------------------------------------------------------------#
[main]

# Left Alt is swapped with Left Meta
leftmeta = layer(alt)
leftalt = layer(meta)

# Right Alt acts as Alpha
rightalt = layer(alpha)

# Caps Lock acts as Control
capslock = layer(control)

#------------------------------------------------------------------------------#
# layers are included

#------------------------------------------------------------------------------#
# Pressing both Shifts together toggles Caps Lock
[shift]
rightshift = capslock
leftshift = capslock

#------------------------------------------------------------------------------#
# Alpha layer; vim-esque, media, home row mods, F keys, etc
[alpha]
# vim-esque
h = left
j = down
k = up
l = right
b = C-left
w = C-right
e = C-right
/ = C-f
o = back
i = forward
u = C-z
r = C-S-z
x = delete
g = home
z = C-=
y = C-insert
p = S-insert

# misc - compose key (configured as Right Meta in niri), enter, menu key, print screen, change input source (configured as Meta + f1 in niri)
; = enter
' = compose

# f-keys
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
- = f11
= = f12

# home row mods (special layers are used to avoid conficts)
a = layer(hrControl)
s = layer(hrShift)
d = layer(hrAlt)
f = layer(hrMeta)

[hrControl:C]
[hrShift:S]
[hrAlt:A]
[hrMeta:M]

[alpha+hrShift]
# vimesque
h = home
j = pagedown
k = pageup
l = end

[alpha+shift]
# vimesque
x = backspace
g = end
z = C--

#------------------------------------------------------------------------------#
# Beta layer; numpad
[beta]
m = 0
j = 1
k = 2
l = 3
u = 4
i = 5
o = 6
0 = /
p = *
; = -
/ = +
