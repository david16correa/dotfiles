sensors:
  - tpacpi: /proc/acpi/ibm/thermal
    indices: [0]
  # - hwmon: /sys/class/hwmon/hwmon5/temp1_input  # Other sensor (amdgpu)

fans:
  - tpacpi: /proc/acpi/ibm/fan  # Use ThinkPad ACPI interface for fan control

levels:
  - ["level auto", 0, 50]       # Let BIOS handle idle (fan off/quiet)
  - ["level 2",    50, 55]      # Low speed
  - ["level 4",    55, 65]      # Medium speed
  - ["level 7",    65, 75]      # High speed
  - ["level full-speed", 75, 1000]  # Max speed above 75°C (safety)
